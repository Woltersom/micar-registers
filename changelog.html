<script>
// Resolves and applies the light/dark theme before the stylesheet paints, so
// the page never flashes the "wrong" theme while assets/js/app.js (which
// re-derives the same value - see resolveTheme()/applyTheme() there, the
// source of truth for this logic) is still loading. Every fresh visit starts
// from the OS/browser's prefers-color-scheme setting; esma-tracker-theme in
// sessionStorage (set via the ☀️/🌙 toggle in the topnav) overrides it for
// the rest of this browsing session only - not remembered across visits.
(function () {
  try {
    var stored = sessionStorage.getItem("esma-tracker-theme");
    var dark = stored === "dark" || (stored !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    var theme = dark ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", theme);
    document.documentElement.style.colorScheme = theme;
  } catch (e) { /* sessionStorage/matchMedia unavailable - CSS default (light) applies */ }
})();
</script>

<script>
applyStaticTranslations();
renderThemeToggle(document.getElementById("theme-toggle-slot"));
renderLangToggle(document.getElementById("lang-toggle-slot"));
highlightNav("changelog");

const SEVEN_DAYS_MS = 7 * 24 * 60 * 60 * 1000;

(async function init() {
  const toolbar = document.getElementById("changelog-toolbar");
  const listEl = document.getElementById("changelog-list");
  const countEl = document.getElementById("changelog-count");
  const footerChecked = document.getElementById("footer-checked");

  let meta = {};
  try { meta = await fetchJSON("data/meta.json"); } catch (e) { /* ignore */ }
  footerChecked.textContent = meta.last_checked
    ? t("footer.lastChecked", formatTimestamp(meta.last_checked))
    : t("footer.neverCheckedShort");

  let changelog = [];
  try { changelog = await fetchJSON("data/history/changelog.json"); } catch (e) { /* none yet */ }

  // Always the last 7 days — no fixed-count cap. ESMA itself only refreshes
  // weekly, so a rolling week is the natural "what's new" window. Ordered
  // newest run first, then by importance within a run (CASPs - especially
  // brand-new ones - then EMT/ART/Whitepapers/Non-compliant); see
  // sortChangelogForDisplay() in app.js.
  const cutoff = Date.now() - SEVEN_DAYS_MS;
  changelog = sortChangelogForDisplay(changelog.filter((c) => new Date(c.timestamp).getTime() >= cutoff));

  let registerFilter = null;
  let typeFilter = null;

  const registerDropdown = buildDropdownFilter({
    label: t("changelogPage.filterRegisterLabel"),
    options: Object.keys(REGISTERS),
    getValue: (key) => key,
    getLabel: (key) => REGISTERS[key].shortLabel,
    onChange: (value) => { registerFilter = value; render(); },
  });
  const typeDropdown = buildDropdownFilter({
    label: t("changelogPage.filterTypeLabel"),
    options: ["added", "changed", "removed"],
    getValue: (v) => v,
    getLabel: (v) => changelogTypeLabel(v),
    searchable: false,
    onChange: (value) => { typeFilter = value; render(); },
  });
  toolbar.insertBefore(registerDropdown.el, countEl);
  toolbar.insertBefore(typeDropdown.el, countEl);

  function render() {
    const filtered = changelog.filter((c) =>
      (!registerFilter || c.register === registerFilter) &&
      (!typeFilter || c.type === typeFilter)
    );
    countEl.textContent = t("changelogPage.count", filtered.length);

    listEl.innerHTML = "";
    if (!filtered.length) {
      listEl.innerHTML = `<p class="filter-note">${escapeHtml(t("changelogPage.emptyFiltered"))}</p>`;
      return;
    }
    for (const c of filtered) {
      listEl.appendChild(buildChangelogItem(c));
    }
  }

  render();
})();
</script>
