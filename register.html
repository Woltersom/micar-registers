<!DOCTYPE html>

<script>
// Resolves and applies the light/dark theme before the stylesheet paints, so
// the page never flashes the "wrong" theme while assets/js/app.js (which
// re-derives the same value - see resolveTheme()/applyTheme() there, the
// source of truth for this logic) is still loading. Every fresh visit starts
// from the OS/browser's prefers-color-scheme setting; esma-tracker-theme in
// sessionStorage (set via the ☀️/🌙 toggle in the topnav) overrides it for
// the rest of this browsing session only - not remembered across visits.
(function () {
  try {
    var stored = sessionStorage.getItem("esma-tracker-theme");
    var dark = stored === "dark" || (stored !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    var theme = dark ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", theme);
    document.documentElement.style.colorScheme = theme;
  } catch (e) { /* sessionStorage/matchMedia unavailable - CSS default (light) applies */ }
})();
</script>

<div class="wrap wrap--register">
  <div class="page-header">
    <h1 id="register-title" data-i18n="registerPage.titleFallback">Register</h1>
  </div>

  <div id="register-root"></div>

  <footer class="site-footer">
    <span id="footer-checked" data-i18n="footer.lastCheckedLoading">Laatst gecontroleerd: laden…</span>
    <span><span data-i18n="footer.sourcePrefix">Bron: </span><a id="footer-source-link" href="https://www.esma.europa.eu/esmas-activities/digital-finance-and-innovation/markets-crypto-assets-regulation-mica" target="_blank" rel="noopener" data-i18n="footer.sourceLinkText">ESMA Interim MiCA Register</a><span id="footer-source-extra"></span></span>
  </footer>
</div>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/app.js"></script>
<script>
applyStaticTranslations();
renderThemeToggle(document.getElementById("theme-toggle-slot"));
renderLangToggle(document.getElementById("lang-toggle-slot"));

const params = new URLSearchParams(location.search);
const type = params.get("type") || "casps";
const config = REGISTERS[type];

if (!config) {
  document.getElementById("register-root").innerHTML = `<p>${escapeHtml(t("registerPage.unknownPrefix"))}${escapeHtml(type)}</p>`;
} else {
  document.getElementById("page-title").textContent = `${config.label} — ${t("brand.title")}`;
  document.getElementById("register-title").textContent = config.label;
  highlightNav(type);

  // Every register mirrors ESMA's EU-wide export (the default footer
  // link/text in the markup above) - a REGISTERS config can still override
  // the link/text with sourceUrl/sourceLinkText/subtitleFn if a future
  // register needs a different primary source.
  if (config.sourceUrl) {
    const sourceLink = document.getElementById("footer-source-link");
    sourceLink.href = config.sourceUrl;
    sourceLink.textContent = config.sourceLinkText || sourceLink.textContent;
  }

  // CASPs additionally folds in AFM-sourced entities (see app.js's REGISTERS.
  // casps.extraSourceUrl) - append a second "en AFM Cryptoregister" link
  // rather than replacing the ESMA one, since this register genuinely blends
  // both sources instead of coming from just one.
  if (config.extraSourceUrl) {
    const extra = document.getElementById("footer-source-extra");
    extra.innerHTML = `${escapeHtml(t("footer.sourceAnd"))}<a href="${escapeHtml(config.extraSourceUrl)}" target="_blank" rel="noopener">${escapeHtml(config.extraSourceLinkText)}</a>`;
  }

  (async function init() {
    const root = document.getElementById("register-root");
    const footerChecked = document.getElementById("footer-checked");

    let meta = {};
    try { meta = await fetchJSON("data/meta.json"); } catch (e) { /* ignore */ }
    footerChecked.textContent = meta.last_checked
      ? t("footer.lastChecked", formatTimestamp(meta.last_checked))
      : t("footer.neverChecked");

    try {
      // Record count + "last generated" used to also repeat as a subtitle
      // right under the page title - redundant with the toolbar's own
      // "X van Y records" count and the footer's "Laatst gecontroleerd" line
      // just below the table, so it's been dropped here.
      const data = await fetchJSON(`data/${config.file}.json`);
      const records = data.records || [];
      renderRegisterTable(root, config, records);
    } catch (e) {
      root.innerHTML = `<p class="filter-note">${escapeHtml(t("registerPage.loadError", e.message))}</p>`;
    }
  })();
}
</script>
